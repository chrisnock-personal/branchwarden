name: branchwarden

services:

  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-branchwarden}
      # No default: compose refuses to start until .env sets one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-branchwarden}
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
    # Not published: only the worker and dashboard reach it, on this project's network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-branchwarden}"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # The published image; `podman-compose build` makes it from this checkout instead.
    image: ghcr.io/chrisnock-personal/branchwarden:${BRANCHWARDEN_VERSION:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      # Lower-case z: shared with the dashboard (Z would make it private to one container under SELinux).
      - keys:/keys:z
    # Its heartbeat file is touched every few seconds, and after each repo during a scan.
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    image: ghcr.io/chrisnock-personal/branchwarden:${BRANCHWARDEN_VERSION:-latest}
    restart: unless-stopped
    entrypoint: ["./entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - keys:/keys:z
      - certs:/certs:z
    ports:
      - "${DASHBOARD_EXPOSE:-8443}:8443"
    # /healthz over its own HTTPS port; it also checks the database.
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: the MCP server over HTTPS, for AI agents on other machines. Started only with
  # `podman-compose --profile mcp up -d`. Each agent sends its own API token; this keeps none.
  mcp:
    image: ghcr.io/chrisnock-personal/branchwarden:${BRANCHWARDEN_VERSION:-latest}
    profiles: ["mcp"]
    restart: unless-stopped
    entrypoint: ["python", "-u", "mcp_service.py"]
    depends_on:
      dashboard:
        condition: service_healthy
    # Not the whole .env: only what it needs to find the dashboard (no database password, no secret key).
    environment:
      BRANCHWARDEN_TLS: ${BRANCHWARDEN_TLS:-on}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    volumes:
      - certs:/certs:ro,z          # the dashboard's certificate: pinned, and served
    ports:
      - "${MCP_EXPOSE:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    name: ${PGDATA_VOLUME:-branchwarden_pgdata}
  # The secret key that encrypts stored tokens and webhook URLs: kept apart from the database. Back it up.
  keys:
    name: branchwarden_keys
  certs:
    name: branchwarden_certs
