<option value="routed" {{ 'selected' if p.target == 'routed' }}>the PR's routed channels</option>
<option value="all" {{ 'selected' if p.target == 'all' }}>every channel</option>
{% for c in channels %}<option value="{{ c.id }}" {{ 'selected' if p.target|string == c.id|string }}>{{ c.kind_label }} · {{ c.name }}</option>{% endfor %}
