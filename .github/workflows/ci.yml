name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the integration and browser tests (tests/test_integration.py, tests/test_browser.py).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: branchwarden
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: branchwarden_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U branchwarden" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://branchwarden:ci-only@localhost:5432/branchwarden_test
      BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt "./cli[mcp]"
      - name: Chromium for the browser test
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt -r requirements-mcp.txt
      - name: Secrets in the history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Backup and restore from scratch: the real stack with docker compose, the
  # demo data and a sealed secret; back up, destroy everything, restore, check.
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Start Branchwarden
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-backup\nDASHBOARD_EXPOSE=8443\n' > .env
          docker compose build -q
          docker compose up -d
          for _ in $(seq 1 60); do curl -skf https://localhost:8443/healthz && break; sleep 2; done
          docker compose exec -T worker python demo.py
      - name: The MCP service, with a real token
        run: |
          docker compose --profile mcp up -d mcp
          for _ in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mcp)")" = healthy ] && break; sleep 2; done
          token=$(docker compose exec -T worker python -c "import apitokens, db
          with db.get_conn() as c: print(apitokens.create(c, 'ci', 'read', 'ci', role='viewer')[1])")
          call() { curl -sk -X POST https://localhost:8765/mcp -H "Content-Type: application/json" \
                     -H "Accept: application/json, text/event-stream" "$@" \
                     -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"overview","arguments":{}}}'; }
          [ "$(call -o /dev/null -w '%{http_code}')" = 401 ] || { echo "no token should get 401"; exit 1; }
          call -H "Authorization: Bearer $token" | grep -q open_prs || { echo "the overview tool didn't answer"; exit 1; }
          # It serves the dashboard's own certificate.
          a=$(echo | openssl s_client -connect localhost:8443 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
          b=$(echo | openssl s_client -connect localhost:8765 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "the MCP service should serve the dashboard's certificate"; exit 1; }
          echo "MCP service: healthy, 401 without a token, answers with one, same certificate"
          docker compose --profile mcp stop mcp
      - name: Back up, destroy, restore
        env:
          ENGINE: docker
          COMPOSE: docker compose
        run: tests/backup_roundtrip.sh
      - name: Logs, if it failed
        if: failure()
        run: docker compose logs --tail 50
