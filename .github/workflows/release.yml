name: Release image

# On a version tag (v1.2.3): build the image for amd64 and arm64 and push it to
# ghcr.io/<owner>/branchwarden as :1.2.3, :1.2 and :latest.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  actions: read          # to check CI passed on the tagged commit

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches version.py
        run: |
          want="v$(python3 -c 'import version; print(version.VERSION)')"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but version.py says $want"
            exit 1
          fi

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                     --json conclusion -q '[.[] | select(.conclusion == "success")] | length')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::CI hasn't passed on $GITHUB_SHA: push the commit, wait for CI, then tag it"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
